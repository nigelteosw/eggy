server:
  listen: ":8080"
  public_base_url: "https://eggy.example.com"
  telegram_webhook_path: "/webhooks/telegram"
  # How many reverse proxies sit in front of Eggy. 0 (the default) means it is
  # reached directly and X-Forwarded-For is ignored; set 1 behind a single
  # proxy such as Railway's. The web login throttle needs this to tell clients
  # apart -- at the wrong value every attempt shares one bucket, so guessing is
  # barely slowed and an attacker can lock the owner out.
  trusted_proxy_hops: 0
# Eggy's home directory. Config, Markdown context, SQLite memory, schedules,
# OAuth records, logs, state, and read-only repository checkouts live here.
data_dir: "/data"
telegram:
  owner_id: 123456789
agent:
  # Telegram: /model changes the active alias; /model default restores this one.
  # /model effort <low|medium|high|max> sets reasoning effort for aliases that support it.
  default_model: "deepseek-pro"
  timezone: "Asia/Singapore"
providers:
  deepseek:
    adapter: "openai_compatible"
    base_url: "https://api.deepseek.com"
    # This names an environment variable. Never place the key itself in YAML.
    api_key_env: "DEEPSEEK_API_KEY"
models:
  deepseek-pro:
    provider: "deepseek"
    model: "deepseek-v4-pro"
    # Optional: exposes /model effort <level> for this alias. Omit for
    # models that don't accept a reasoning_effort request parameter.
    reasoning_efforts: ["low", "medium", "high", "max"]
repositories:
  - name: "eggy"
    clone_url: "https://github.com/nigelteosw/eggy.git"
    base_branch: "main"
    protected_branches: ["main"]
    # Marks the repository holding Eggy's own source. It grants nothing: it
    # only tells the agent where its own AGENTS.md and architecture docs live.
    self: true
runner:
  root: "/data/runs"
  timeout: "45m"
  retention: "30m"
  max_output_bytes: 1048576
  allowed_env: ["PATH", "LANG", "LC_ALL", "TERM"]
# How the web panel looks: "dark" (charcoal, the default) or "light" (paper).
# It lives here rather than in the browser so it follows the owner to whatever
# machine they next log in from. This is the one section nothing at runtime
# reads, so changing it takes effect on the next page load rather than on a
# restart -- the Appearance page in the web panel writes it for you.
# appearance:
#   theme: "dark"
# A periodic check-in the owner is not present for. Omit the section and it
# costs nothing: no ticker, no goroutine, no model call. Each tick runs an
# isolated read-only turn that is allowed to conclude there is nothing worth
# saying, so it only reaches Telegram when something warrants it. Requires a
# telegram block, since that is where unprompted output goes.
# heartbeat:
#   interval: "3h"
#   instruction: "Check the deploy and open pull requests."
# One Google grant across every product listed. The client is a Desktop
# (installed app) client, which Google grants an implicit loopback redirect:
# nothing is registered in the console, nothing has to be publicly reachable,
# and server.public_base_url plays no part in authorizing it. `/google login`
# returns a URL, the browser fails to load the page it lands on, and the owner
# pastes that address back -- the code is in its query string.
#
# Leave the whole section out and none of it exists: no token store is opened,
# no tool schema is built, no scope is ever requested.
# google:
#   enabled: true
#   client_id: "xxxx.apps.googleusercontent.com"
#   client_secret_env: "GOOGLE_CLIENT_SECRET"
#   # Only the products named here become tools. Adding one later needs a new
#   # login, because scopes are granted once for the whole client.
#   products: ["calendar", "gmail", "contacts"]
#   # Omit scopes to request what the listed products need. Set them to narrow
#   # the consent screen -- readonly variants, for instance.
#   scopes: []
#   # Which calls stop and ask you first, as product.action. Leave it out and
#   # every action that writes anything is gated -- Eggy reads your mail
#   # unasked and sends none without asking. Naming actions yourself replaces
#   # that default rather than adding to it, and an empty list turns the gates
#   # off entirely. "gmail.*" gates a whole product. This narrows or widens
#   # what the tools themselves declare; approvals.mode below decides whether
#   # any of it is consulted at all.
#   require_approval: ["gmail.send", "calendar.delete", "drive.share"]
#   timeout: "30s"
#   max_output_bytes: 131072
# How much Eggy asks before it acts. strict asks before every tool call,
# reading included; normal asks before anything that writes and is the
# default; auto asks nothing. This is only where a fresh deployment starts --
# once you set /mode, your choice is durable and outranks this file.
approvals:
  mode: "normal"

mcp:
  # Anything listed here is trusted: a server can only get here by you putting
  # it here, so reviewing the server IS the approval, and its tools otherwise
  # run without asking. Use tool_filter to narrow what a server exposes at all,
  # and require_approval to name the individual tools that must still ask you
  # before each call -- the mutations, typically. See the docs site under
  # docs/src/content/docs/project/architecture.md.
  servers:
    # A stdio server is a local subprocess Eggy spawns and speaks to over
    # stdin/stdout, which is how most of the MCP ecosystem ships. It takes a
    # command and args instead of a url, and always auth: none -- its
    # authorization is whatever env_allowlist grants it. Only the named
    # variables are forwarded (plus PATH and HOME, without which nothing can
    # be launched); every other secret Eggy holds stays out of the child.
    # The child runs as the same user with the same filesystem access as Eggy,
    # so treat a stdio server as trusted code, exactly like a configured
    # repository.
    # filesystem:
    #   transport: "stdio"
    #   auth: "none"
    #   command: "npx"
    #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/data/repos"]
    #   env_allowlist: []
    #   enabled: true
    #   connect_timeout: "20s"
    #   timeout: "60s"
    #   max_output_bytes: 131072
    #   tool_filter:
    #     include: ["read_text_file", "list_directory"]
    # An OAuth server that does not implement dynamic client registration needs
    # a client you registered by hand. The client id is not a secret -- it
    # travels in the authorization URL -- so it lives here; the secret is named
    # here and read from the environment. Leave oauth_client_secret_env unset
    # for a public client (PKCE only).
    #
    # For Google, use the google: section above instead: one grant covers every
    # product, it needs no public address, and it reaches Contacts, which
    # Google hosts no MCP server for.
    # tickets:
    #   url: "https://mcp.example.com/v1"
    #   transport: "streamable-http"
    #   auth: "oauth"
    #   oauth_client_id: "eggy-client"
    #   oauth_client_secret_env: "TICKETS_CLIENT_SECRET"
    #   oauth_scopes: ["tickets:read"]
    #   enabled: true
    railway:
      url: "https://mcp.railway.com"
      transport: "streamable-http"
      auth: "oauth"
      enabled: true
      connect_timeout: "10s"
      timeout: "60s"
      max_output_bytes: 131072
      supports_parallel_tool_calls: false
      # Consecutive failures of one tool that take that tool, and only that
      # tool, out of service for cooldown.
      failure_threshold: 3
      cooldown: "30s"
      tool_filter:
        include:
          - "check-railway-status"
          - "list-projects"
          - "create-project-and-link"
          - "list-services"
          - "link-service"
          - "deploy"
          - "deploy-template"
          - "create-environment"
          - "link-environment"
          - "set-variables"
          - "generate-domain"
          - "get-logs"
        exclude: []
      # Tools that must ask before every call. Exact remote names, the same
      # ones tool_filter uses -- a name this server does not advertise is
      # reported as a warning rather than silently gating nothing. A gated call
      # does not run when the model asks for it: you get an approve prompt
      # showing the arguments, and the result comes back to you rather than to
      # the model. `/auto` switches the gate off for everything when you want
      # to work uninterrupted; /status tells you while it is off.
      require_approval:
        - "deploy"
        - "set-variables"
