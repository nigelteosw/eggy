<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9fbf8" />
    <title>Eggy</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f9fbf8;
        color: #1c211b;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 0.75rem;
      }
      code {
        font-family: ui-monospace, monospace;
        background: rgba(28, 33, 27, 0.08);
        border-radius: 0.25rem;
        padding: 0.1rem 0.35rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14170f;
          color: #eef1e9;
        }
        code {
          background: rgba(238, 241, 233, 0.12);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The web UI has not been built.</h1>
      <p>
        This binary was compiled without a web UI bundle, so there is nothing to
        serve here. Eggy itself is running: Telegram and the HTTP API are
        unaffected.
      </p>
      <p>Build the bundle with <code>make build-web</code>, then rebuild.</p>
    </main>
  </body>
</html>
