<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Paints the last chosen palette and look before the app loads, so a dark-mode
         owner never sees a light frame first. Its key and values match
         src/lib/theme.ts; the app takes over as soon as the server answers. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("eggy.theme");
          var dark = stored === "dark" || ((stored === null || stored === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          // The account's look, as src/lib/theme.ts caches it: colour tokens
          // for each palette, already checked by the server. Fonts load once
          // the app runs; until then the fallback face shows.
          var look = JSON.parse(window.localStorage.getItem("eggy.look") || "{}");
          var tokens = (dark ? look.dark : look.light) || {};
          for (var name in tokens) document.documentElement.style.setProperty("--" + name, tokens[name]);
        } catch (error) {
          // Storage refused: the app paints from the server's answer instead.
        }
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F1E7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0F11" />
    <title>Eggy</title>
    <link rel="icon" href="/egg.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Eggy" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
